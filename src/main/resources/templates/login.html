
<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OCMS | Login</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f1f5f9;
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .container {
            background: white;
            width: 350px;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 20px #00000015;
        }
        h1 { text-align: center; color: #1e293b; }
        p { color: #64748b; text-align: center; }
        label { display: block; margin-top: 16px; }
        input {
            box-sizing: border-box;
            width: 100%;
            padding: 11px;
            margin-top: 6px;
            border: 1px solid #cbd5e1;
            border-radius: 6px;
        }
        button {
            width: 100%;
            padding: 12px;
            margin-top: 22px;
            background: #2563eb;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
        }
        .message { padding: 10px; border-radius: 6px; }
        .error { background: #fee2e2; color: #991b1b; }
        .success { background: #dcfce7; color: #166534; }
        a { color: #2563eb; }
    </style>
</head>
<body>
<div class="container">
    <h1>OCMS Login</h1>
    <p>Online Course Management System</p>

    <div class="message error" th:if="${param.error}">
        Invalid email or password.
    </div>

    <div class="message success" th:if="${param.logout}">
        You have logged out successfully.
    </div>

    <div class="message success" th:if="${success}"
         th:text="${success}"></div>

    <form th:action="@{/login}" method="post">
        <label for="email">Email</label>
        <input type="email" id="email" name="email"
               placeholder="Enter your email" required>

        <label for="password">Password</label>
        <input type="password" id="password" name="password"
               placeholder="Enter your password" required>

        <button type="submit">Login</button>
    </form>

    <p>Don't have an account?
        <a th:href="@{/register}">Register here</a>
    </p>
</div>
</body>
</html>
