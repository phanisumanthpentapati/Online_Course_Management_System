
<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OCMS | Register</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f1f5f9;
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px 0;
        }
        .container {
            background: white;
            width: 370px;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 20px #00000015;
        }
        h1 { text-align: center; color: #1e293b; }
        p { text-align: center; color: #64748b; }
        label { display: block; margin-top: 14px; }
        input, select {
            box-sizing: border-box;
            width: 100%;
            padding: 11px;
            margin-top: 6px;
            border: 1px solid #cbd5e1;
            border-radius: 6px;
        }
        button {
            width: 100%;
            padding: 12px;
            margin-top: 22px;
            background: #2563eb;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
        }
        .error {
            background: #fee2e2;
            color: #991b1b;
            padding: 10px;
            border-radius: 6px;
        }
        a { color: #2563eb; }
    </style>
</head>
<body>
<div class="container">
    <h1>Create Account</h1>
    <p>Join the Online Course Management System</p>

    <div class="error" th:if="${error}" th:text="${error}"></div>

    <form th:action="@{/register}" method="post">
        <label for="fullName">Full Name</label>
        <input type="text" id="fullName" name="fullName"
               placeholder="Enter your full name" required>

        <label for="email">Email</label>
        <input type="email" id="email" name="email"
               placeholder="Enter your email" required>

        <label for="password">Password</label>
        <input type="password" id="password" name="password"
               minlength="8" placeholder="At least 8 characters" required>

        <label for="confirmPassword">Confirm Password</label>
        <input type="password" id="confirmPassword"
               name="confirmPassword"
               minlength="8" placeholder="Re-enter your password" required>

        <label for="role">Register As</label>
        <select id="role" name="role" required>
            <option value="">Select your role</option>
            <option value="STUDENT">Student</option>
            <option value="INSTRUCTOR">Instructor</option>
        </select>

        <button type="submit">Register</button>
    </form>

    <p>Already have an account?
        <a th:href="@{/login}">Login here</a>
    </p>
</div>
</body>
</html>
